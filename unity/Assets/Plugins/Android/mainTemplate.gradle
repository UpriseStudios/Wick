apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
apply from: '../shared/common.gradle'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // Deferred vault links: the Play Store passes the vault code through the install referrer.
    implementation 'com.android.installreferrer:installreferrer:2.2'
    // Consent (GDPR/UK): Google's User Messaging Platform form, driven by WickConsent.java.
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
    // Rewarded ads: the LevelPlay native SDK the Ads Mediation 9.3.2 package's Java bridge calls.
    // Declared here (as IronSourceSDKDependencies.xml 9.3.0 lists it) instead of installing the
    // Mobile Dependency Resolver plugin into Assets.
    implementation 'com.unity3d.ads-mediation:mediation-sdk:9.3.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
**DEPS**}

android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"
    compileSdk **APIVERSION**
    buildToolsVersion "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
