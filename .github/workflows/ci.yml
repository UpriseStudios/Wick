name: CI

on:
  push:
  pull_request:

jobs:
  sim-dotnet:
    name: Sim tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test sim
        run: dotnet test server/Wick.Sim.Server.Tests

      - name: Build and smoke-run replay-cli
        run: dotnet run --project tools/replay-cli

  # Needs repo secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD. See README.
  unity-editmode:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write   # unity-test-runner posts results as a check run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: artifacts
