<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Can you crack this vault? | Wax Bandits</title>
  <meta name="description" content="A friend dared you to raid their vault in Wax Bandits. Tiny thieves, big heists.">
  <meta property="og:title" content="Can you crack this vault?">
  <meta property="og:description" content="Sneak through traps and guardians as Wick, a living candle thief.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">WAX BANDITS</p>
    <h1>Can you crack this vault?</h1>

    <section class="vault" id="vault" aria-live="polite">
      <p class="code-label">Vault code</p>
      <p class="code" id="code">--------</p>
      <dl class="stats" id="stats" hidden>
        <div><dt>Vault Level</dt><dd id="level"></dd></div>
        <div><dt>Traps and guardians</dt><dd id="traps"></dd></div>
        <div><dt>Raiders snuffed</dt><dd id="snuffs"></dd></div>
      </dl>
      <p class="note" id="note"></p>
    </section>

    <a class="button play" id="play" href="#">Get it on Google Play</a>
    <a class="button apple" id="apple" href="#" hidden>Download on the App Store</a>
    <button class="button copy" id="copy" type="button">Copy vault code</button>
    <p class="hint" id="hint">Already have Wax Bandits? Open the app and it will find this vault.</p>
  </main>
  <script src="/vault.js"></script>
</body>
</html>
